<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Privacy field assets</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #131313;
      color: #f5f5f5;
      font-family: ui-sans-serif, system-ui, sans-serif;
      padding: 2rem 1.5rem 4rem;
    }
    h1 { font-size: 1.4rem; margin: 0 0 0.4rem; }
    p { color: #9b9b9b; margin: 0 0 1.6rem; max-width: 40rem; }
    h2 { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: #21c95e; margin: 2rem 0 0.8rem; }
    .tree { width: min(100%, 920px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; background: #1b1b1b; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.85rem; }
    figure {
      margin: 0;
      padding: 1rem 0.85rem 0.9rem;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      background: #1b1b1b;
      text-align: center;
    }
    figure img { width: 64px; height: 64px; }
    figcaption { margin-top: 0.65rem; font-size: 0.78rem; color: #9b9b9b; }
    figcaption strong { display: block; color: #f5f5f5; margin-bottom: 0.15rem; }
  </style>
</head>
<body>
  <h1>Background drawings — not photo files</h1>
  <p>
    These are inline SVGs drawn in code (PrivacyField.tsx). Nothing was downloaded
    from the internet. Open this page at
    <code>http://localhost:5180/privacy-field/preview.html</code>
  </p>

  <h2>Merkle tree (large background graph)</h2>
  <img class="tree" src="./00-merkle-tree.svg" alt="Merkle tree graph" />

  <h2>Floating glyphs</h2>
  <div class="grid">
    <figure><img src="./01-shield.svg" alt="" /><figcaption><strong>Shield</strong>Shielded pool</figcaption></figure>
    <figure><img src="./02-eyeoff.svg" alt="" /><figcaption><strong>Eye off</strong>Unlinkable</figcaption></figure>
    <figure><img src="./03-lock.svg" alt="" /><figcaption><strong>Lock</strong>Non-custodial</figcaption></figure>
                <figure><img src="./04-proof.svg" alt="" /><figcaption><strong>Verified</strong>ZK proof</figcaption></figure>
    <figure><img src="./05-note.svg" alt="" /><figcaption><strong>Note</strong>Private note</figcaption></figure>
    <figure><img src="./06-merkle-root.svg" alt="" /><figcaption><strong>Tree</strong>Merkle root</figcaption></figure>
    <figure><img src="./07-nullifier.svg" alt="" /><figcaption><strong>X circle</strong>Nullifier</figcaption></figure>
    <figure><img src="./08-mix.svg" alt="" /><figcaption><strong>Overlap</strong>Anonymity set</figcaption></figure>
    <figure><img src="./09-commit.svg" alt="" /><figcaption><strong>Chevrons</strong>Commitment</figcaption></figure>
    <figure><img src="./10-key.svg" alt="" /><figcaption><strong>Key</strong>Recovery Code</figcaption></figure>
  </div>
</body>
</html>
