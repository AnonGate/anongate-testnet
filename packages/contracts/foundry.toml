[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "read-write", path = "./deployments" },
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
